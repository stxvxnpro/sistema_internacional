# ==============================================================================
# 1. CONFIGURACIÓN Y SECRETOS COMPARTIDOS (RED HAT SERVICES & DB)
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: health-db-secret
  labels:
    app.kubernetes.io/part-of: international-health-system
type: Opaque
stringData:
  POSTGRESQL_USER: "health_admin"
  POSTGRESQL_PASSWORD: "RedHatHealth2026!Secure"
  POSTGRESQL_DATABASE: "global_health_db"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redhat-health-config
  labels:
    app.kubernetes.io/part-of: international-health-system
data:
  QUARKUS_DATASOURCE_DB_KIND: "postgresql"
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://health-postgres-svc:5432/global_health_db"
  RH_SSO_AUTH_SERVER_URL: "https://sso.salud-global.apps.ocp.example.com/auth"
  RH_SSO_REALM: "international-health"
  RH_3SCALE_GATEWAY_URL: "https://api-fhir.salud-global.apps.ocp.example.com/v1"
  RH_AMQ_STREAMS_BOOTSTRAP: "health-kafka-bootstrap.amq-streams.svc:9092"
  REACT_APP_API_URL: "/api/v1/patients"

# ==============================================================================
# 2. CAPA DE BASE DE DATOS: RED HAT POSTGRESQL 16 + ALMACENAMIENTO PERSISTENTE
# ==============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: health-postgres-pvc
  labels:
    app: health-postgres
    app.kubernetes.io/part-of: international-health-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-postgres
  labels:
    app: health-postgres
    app.kubernetes.io/part-of: international-health-system
    app.openshift.io/runtime: postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: health-postgres
  template:
    metadata:
      labels:
        app: health-postgres
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: health-db-secret
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "health_admin", "-d", "global_health_db"]
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "health_admin", "-d", "global_health_db"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: health-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: health-postgres-svc
  labels:
    app: health-postgres
spec:
  selector:
    app: health-postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432

# ==============================================================================
# 3. CAPA DE BACKEND: RED HAT BUILD OF QUARKUS (API REST HL7 FHIR)
# ==============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-backend-quarkus
  labels:
    app: health-backend-quarkus
    app.kubernetes.io/part-of: international-health-system
    app.openshift.io/runtime: quarkus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-backend-quarkus
  template:
    metadata:
      labels:
        app: health-backend-quarkus
    spec:
      containers:
        - name: quarkus-api
          image: image-registry.openshift-image-registry.svc:5000/health-ns/health-backend-quarkus:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: redhat-health-config
          env:
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: health-db-secret
                  key: POSTGRESQL_USER
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: health-db-secret
                  key: POSTGRESQL_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: health-backend-svc
  labels:
    app: health-backend-quarkus
spec:
  selector:
    app: health-backend-quarkus
  ports:
    - name: http-8080
      protocol: TCP
      port: 8080
      targetPort: 8080

# ==============================================================================
# 4. CAPA DE FRONTEND: REACT + NGINX SOBRE RED HAT UBI 9
# ==============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-frontend-react
  labels:
    app: health-frontend-react
    app.kubernetes.io/part-of: international-health-system
    app.openshift.io/runtime: react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-frontend-react
  template:
    metadata:
      labels:
        app: health-frontend-react
    spec:
      containers:
        - name: react-nginx
          image: image-registry.openshift-image-registry.svc:5000/health-ns/health-frontend-react:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: redhat-health-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: health-frontend-svc
  labels:
    app: health-frontend-react
spec:
  selector:
    app: health-frontend-react
  ports:
    - name: http-8080
      protocol: TCP
      port: 8080
      targetPort: 8080

# ==============================================================================
# 5. RUTAS DE ACCESO EXTERNO CON TLS (OPENSHIFT ROUTER)
# ==============================================================================
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: health-portal-route
  labels:
    app.kubernetes.io/part-of: international-health-system
  annotations:
    haproxy.router.openshift.io/hsts_header: "max-age=31536000;includeSubDomains;preload"
spec:
  to:
    kind: Service
    name: health-frontend-svc
    weight: 100
  port:
    targetPort: http-8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: health-api-route
  labels:
    app.kubernetes.io/part-of: international-health-system
spec:
  path: /api
  to:
    kind: Service
    name: health-backend-svc
    weight: 100
  port:
    targetPort: http-8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
